<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYOX Korean Lab — 10 Day Practice</title>
<style>
*{box-sizing:border-box}
:root{--bg:#070a12;--panel:#111827;--panel2:#182235;--text:#f8fafc;--muted:#9ca3af;--purple:#8b5cf6;--red:#ef4444;--green:#22c55e;--border:#29364d}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;background:radial-gradient(circle at 50% 0,#21153b 0,#090c15 45%,#05070c 100%)}
header{text-align:center;padding:28px 16px 12px}.logo{font-size:13px;letter-spacing:4px;color:#c4b5fd;font-weight:900}
h1{font-size:clamp(28px,5vw,48px);margin:7px 0}.sub{color:var(--muted);line-height:1.7;margin:auto;max-width:760px}
.wrap{width:min(1050px,94%);margin:auto;padding-bottom:60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 10px}
.days{display:flex;gap:8px;overflow:auto;padding:5px}.day{border:1px solid var(--border);background:#0d1422;color:#dbeafe;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;white-space:nowrap}.day.active{background:linear-gradient(135deg,#7c3aed,#ef4444);border-color:transparent}
.reset{border:1px solid var(--border);background:#0d1422;color:white;padding:10px 14px;border-radius:12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:rgba(17,24,39,.9);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(24,34,53,.97),rgba(12,18,30,.97));border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 25px 90px #0005}
.qno{font-weight:900;color:#a78bfa}.progress{height:9px;background:#090f1b;border-radius:99px;overflow:hidden;margin:12px 0 28px}.bar{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ef4444);transition:.3s}
.question{text-align:center;font-size:clamp(38px,7vw,62px);font-weight:950;margin:22px 0 6px}.hint{text-align:center;color:var(--muted);margin-bottom:25px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}.option{background:#0d1524;border:1px solid var(--border);color:white;border-radius:16px;padding:16px;text-align:left;cursor:pointer;font-size:16px;transition:.18s}.option:hover{border-color:#8b5cf6;transform:translateY(-2px)}.option.correct{background:#14532d;border-color:#22c55e}.option.wrong{background:#5f1717;border-color:#ef4444}.option.disabled{cursor:default}
.bn{display:block;color:#cbd5e1;margin-top:4px}.note{display:none;margin-top:20px;padding:18px;border-radius:16px;background:#09101d;border:1px solid #334155;line-height:1.8}.note.show{display:block}.note-title{color:#fbbf24;font-weight:900;margin-bottom:6px}
.next{display:none;width:100%;border:0;border-radius:15px;padding:15px;margin-top:17px;background:linear-gradient(135deg,#7c3aed,#ef4444);color:white;font-weight:900;font-size:16px;cursor:pointer}.next.show{display:block}
.finish{display:none;text-align:center;padding:30px}.finish.show{display:block}.big{font-size:72px;font-weight:1000;color:#a78bfa}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<header>
<div class="logo">AYOX KOREAN LAB</div>
<h1>🇰🇷 Korean 10 Day Practice</h1>
<p class="sub">বাংলায় কোরিয়ান শেখো — প্রতিদিন ১৫০টি practice item, MCQ, instant feedback এবং pronunciation note।</p>
</header>
<div class="wrap">
<div class="top"><div class="days" id="days"></div><button class="reset" onclick="startDay(day)">↻ Reset Day</button></div>
<div class="stats">
<div class="stat"><b id="dayText">Day 1</b><span>Current Day</span></div>
<div class="stat"><b id="count">1 / 150</b><span>Question</span></div>
<div class="stat"><b id="score">0</b><span>Correct</span></div>
<div class="stat"><b id="accuracy">0%</b><span>Accuracy</span></div>
</div>
<section class="card" id="quiz">
<div class="qno" id="qno">QUESTION 1</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div>
<div class="hint">সঠিক English + বাংলা meaning নির্বাচন করো</div>
<div class="options" id="options"></div>
<div class="note" id="note"><div class="note-title">📝 Note / নোট</div><div id="noteText"></div></div>
<button class="next" id="next" onclick="nextQuestion()">Next Question →</button>
</section>
<section class="finish" id="finish">
<div>🎉 DAY COMPLETE!</div>
<h2 id="finishTitle"></h2>
<div class="big" id="finalScore">0%</div>
<p id="finalMsg"></p>
<button class="next show" onclick="startDay(day)">Practice Again</button>
</section>
</div>

  b.textContent="Day "+d;
  b.onclick=()=>startDay(d);
  b.id="day"+d;
  $("days").appendChild(b);
}
function list(){return WORDS.slice((day-1)*PER_DAY,day*PER_DAY)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function startDay(d){
 day=d;q=0;score=0;answered=false;
 for(let i=1;i<=DAYS;i++)$("day"+i).classList.toggle("active",i===d);
 $("quiz").style.display="block";$("finish").classList.remove("show");render();
}
function render(){
 const arr=list(), item=arr[q];
 answered=false;
 $("dayText").textContent="Day "+day;
 $("count").textContent=(q+1)+" / "+PER_DAY;
 $("score").textContent=score;
 $("accuracy").textContent=(q?Math.round(score/q*100):0)+"%";
 $("qno").textContent="QUESTION "+(q+1);
 $("bar").style.width=(q/PER_DAY*100)+"%";
 $("question").textContent=item[0];
 $("note").classList.remove("show");$("next").classList.remove("show");
 $("noteText").innerHTML="";
 const correct={en:item[1],bn:item[2],r:item[3],br:item[4]};
 const distractors=shuffle(arr.filter((_,i)=>i!==q)).slice(0,3).map(x=>({en:x[1],bn:x[2],r:x[3],br:x[4]}));
 const options=shuffle([correct,...distractors]);
 $("options").innerHTML="";
 options.forEach(opt=>{
   const b=document.createElement("button");
   b.className="option";
   b.innerHTML='<strong>'+esc(opt.en)+'</strong><span class="bn">'+esc(opt.bn)+'</span>';
   b.onclick=()=>check(b,opt,correct);
   $("options").appendChild(b);
 });
}
function check(btn,opt,correct){
 if(answered)return;
 answered=true;
 const buttons=[...document.querySelectorAll(".option")];
 buttons.forEach(b=>b.classList.add("disabled"));
 const right=opt.en===correct.en && opt.bn===correct.bn;
 if(right)btn.classList.add("correct");
 else{
   btn.classList.add("wrong");
   buttons.forEach(b=>{
     if(b.querySelector("strong")?.textContent===correct.en && b.querySelector(".bn")?.textContent===correct.bn)b.classList.add("correct");
   });
 }
 if(right)score++;
 const item=list()[q];
 $("noteText").innerHTML=
   "<b>Korean:</b> "+esc(item[0])+
   "<br><b>বাংলা অর্থ:</b> "+esc(item[2])+
   "<br><b>English pronunciation:</b> "+esc(item[3])+
   "<br><b>বাংলা pronunciation:</b> "+esc(item[4])+
   "<br><br><span style='color:#94a3b8'>💡 প্রতিটি শব্দ/phrase কয়েকবার জোরে পড়ে practice করো।</span>";
 $("note").classList.add("show");$("next").classList.add("show");
 $("score").textContent=score;$("accuracy").textContent=Math.round(score/(q+1)*100)+"%";
 $("bar").style.width=((q+1)/PER_DAY*100)+"%";
}
function nextQuestion(){
 if(!answered)return;
 if(q<PER_DAY-1){q++;render()}else finishDay();
}
function finishDay(){
 $("quiz").style.display="none";$("finish").classList.add("show");
 const pct=Math.round(score/PER_DAY*100);
 $("finishTitle").textContent="Day "+day+" Complete";
 $("finalScore").textContent=pct+"%";
 $("finalMsg").textContent="১৫০টির মধ্যে "+score+"টি সঠিক। "+(pct>=80?"দারুণ! 🔥":"আরও একবার practice করলে আরও ভালো হবে 💪");
}
startDay(1);
</script>
</body>
</html>
